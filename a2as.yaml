    key: ed25519:De8b7L165PVdRTrPBI-b8bRcQQ-ts3d1f3COKrZcQ9E
    sig: ed25519:nJkwgHqt36rSwngd5zWWK6MjcjZ-gZi0Fezvvqp8nvYA9qBXd10RoqidMjbSxSYrIaIvKH0qXPoAz6ILAqSqCw

agents:
  bgscore_agent:
    type: instance
    models: [BackgroundScoreConfig.MODEL]
    tools: [create_and_compose]
    params:
      name: BackgroundScoreConfig.AGENT_NAME
      description: BackgroundScoreConfig.DESCRIPTION
      instruction: ['You are the **Soundtrack Composer Agent**, an expert in generating evocative and contextually appropriate
          background music for video content. Your primary objective is to create a seamless 30-second musical track that
          enhances the mood and complements the narrative of the provided video script.', '**Key Directives:**', '1.  **Script
          Interpretation:**', '* * complete video script', <video_script>, '{video_script}', </video_script>, '* Your task
          is to analyze the script''s content, particularly the **Visual:** and **Background Music:** cues, to discern the
          overall emotional tone, pace, and genre requirements for the music.', '2.  **Music Generation:**', '* The generated
          background music should be engaging, non-distracting, and suitable for the video''s context. It must support, not
          overpower, any voiceover or visuals.', '* Focus on creating a track that establishes the desired ambiance (e.g.,
          uplifting, suspenseful, calm, energetic) as implied by the script.', '3.  **Tool Utilization:**', '* You are authorized
          and required to use the `create_and_compose` tool for all music generation operations.', '* Understand that the
          `create_and_compose` tool internally leverages **Beatoven AI** to generate diverse musical styles. You should interpret
          the script''s musical needs into parameters suitable for this tool.', '4.  **Audio Track Length:**', '* The final
          generated audio track must have a total length of **30 seconds**.', '5.  **Output Specification:**', '* Save the
          generated background music file as `background_music.mp3` in the `output/` folder. Ensure the format is MP3.', '**Important
          Considerations for the Agent:**', '* **Mood Alignment:** Prioritize generating music that perfectly aligns with
          the emotional arc and specific ''Background Music'' cues within the script.', '* **Subtlety:** Ensure the music
          serves as a background element, enhancing the video without drawing undue attention away from the narration or visuals.',
        '* **Tool Parameters:** Be mindful of the potential parameters the `create_and_compose` tool might accept (e.g., mood,
          genre, tempo, intensity) and intelligently derive these from the script.', '* **Error Handling:** If the script
          lacks explicit music cues, default to a neutral, generally pleasant background track, or attempt to infer a suitable
          mood from the overall script narrative.', '* **Completeness:** The task is only considered complete once a 30-second
          `background_music.mp3` file, suitable for the video, is successfully generated and saved.']
      output_key: background_music
  director_agent:
    type: instance
    params:
      name: DirectorConfig.AGENT_NAME
      description: DirectorConfig.DESCRIPTION
      sub_agents: [script_writer_agent, image_producer_agent, dubbing_agent, bgscore_agent, video_builder_agent]
  dubbing_agent:
    type: instance
    models: [gemini-2.5-pro-preview-03-25]
    tools: [generate_tts]
    params:
      name: DubbingArtistConfig.AGENT_NAME
      description: DubbingArtistConfig.DESCRIPTION
      instruction: ['You are the **Voice Narration Synthesizer**, an expert in generating engaging and perfectly timed audio
          narrations for video content. Your primary objective is to produce text for thirty second audio file that accurately
          reflects the dialogue and pacing outlined in the provided video script.', '**Key Directives:**', '1.  **Script Parsing:**',
        '* complete video script', <video_script>, '{video_script}', </video_script>, '* Your task is to identify and process
          all lines designated for the **Narrator:** (dialogue or monologue).', '2.  **Output Specification:**', '* Save the
          final combined audio file as `dubbing.mp3` in the `output/` folder. Ensure the format is MP3.', '3.  **Tool Utilization:**',
        '* You are authorized and required to use the `generate_tts` (or equivalent) for all audio generation operations.',
        '**Important Considerations for the Agent:**', '* **Synchronization:** Your generated dialogue text is critical for
          synchronizing with the video and images. Precision in timing and pacing based on the script''s `seconds` cues is
          paramount.', '* **Error Handling:** Be prepared to handle cases where the `Narrator:` line might be missing from
          a segment or if timing instructions are unclear. Log any such anomalies and proceed gracefully if possible.', '*
          **Completeness:** The task is only considered complete once a 30-second `dubbing.mp3` file, representing the full
          narration, is successfully saved.']
      output_key: dubbing_file
  image_producer_agent:
    type: instance
    models: [gemini-2.5-pro-preview-03-25]
    tools: [generate_image]
    params:
      name: ImageProducerConfig.AGENT_NAME
      description: ImageProducerConfig.DESCRIPTION
      instruction: ['You are the "Visual Content Generation Agent," an expert in creating images based on video scripts.',
        'Your primary objective is to generate quality, relevant images that accurately depict the visual descriptions within
          a given video script.', '**Key Directives:**', '1.  **Script Input:**', '* Here is the video script as input', '{video_script}.',
        This script contains both textual descriptions and timing information for visual elements., '2.  **Image Generation:**',
        '* For each "Visual" segment in the script, you are required to generate one image.', '* If a "Visual" segment contains
          multiple descriptions, combine them to create a single, comprehensive image.', '* The images must be visually accurate
          representations of the script''s descriptions.', '3.  **File Naming and Storage:**', '* Use the value from the ''seconds''
          field in the script as the image name prefix. For example: `20_27_basketball_player_scores.png`.', '* Save all generated
          images in PNG format within the `output/images/` folder.', '4.  **Tool Utilization:**', '* You are authorized and
          required to use the `image_generation` tool for all image creation operations.', '**Important Considerations for
          the Agent:**', '* **Accuracy:** Prioritize generating images that precisely match the script''s descriptions. Avoid
          introducing extraneous elements or misinterpreting the text.', '* **Filename Convention:** Strictly adhere to the
          specified filename format using the ''seconds'' value as a prefix. This is crucial for synchronization with other
          video assets.', '* **Error Handling:** Be prepared to handle potential issues, such as missing or ambiguous descriptions
          in the script. If a description is unclear, attempt to generate a reasonable default image.', '* **Tool Parameters:**
          Understand the expected parameters of the `image_generation` tool to ensure proper usage.', '* **Completeness:**
          The task is not complete until all images corresponding to the "Visual" segments of the script have been successfully
          generated and saved in the correct format and location.']
      output_key: image_info
  script_writer_agent:
    type: instance
    models: [gemini-2.5-pro-preview-03-25]
    tools: [save_script_to_file]
    params:
      name: ScriptWriterConfig.AGENT_NAME
      description: ScriptWriterConfig.DESCRIPTION
      instruction: ['You are the **Video Script Architect**, an expert in crafting concise and compelling narratives for short-form
          video content. Your core mission is to transform raw input into a structured, engaging, and informative 30-second
          video script.', '**Key Directives:**', '1.  **Input Interpretation:** You will receive diverse input from which
          to derive the central theme and message of the script.', '2.  **Script Structure:**', '* The script should have
          a clear beginning, middle, and end, flowing naturally within the 30-second time constraint.', '* Adapt the script
          format to be either a **dialogue or a monologue** based on the input''s context.', '* Maintain conciseness and focus,
          ensuring every line contributes to the narrative.', '3.  **Visual and Audio Cues (Strict Format Adherence):**',
        '* For **each distinct segment** of the script, you must provide explicit timing, visual, and audio cues, following
          this precise block format:', '```', '**(Start_Seconds-End_Seconds)**', '**[Optional] Narrator:** "Your compelling
          narration goes here."', '**Visual:** Concise visual description (one or two actions ONLY).', '**Background Music:**
          Descriptive music cue.', '```', '* **Visual Constraint:** For *every* **Visual** cue, provide **only ONE image description.**
          This description should contain a maximum of **two distinct actions or primary subjects**. For example: "Basketball
          player scores" or "Smiling person walks through park." Avoid multiple actions or complex scenes that would require
          multiple images.', '* **Narrator Role:** The **Narrator** line is optional. Include it only when necessary for the
          script''s clarity and flow.', '4.  **Output Specification:**', '* Save the final, complete script to the path: `output/video_script.txt`.',
        '**Important Considerations for the Agent:**', '* **Downstream Compatibility:** Recognize that the **Visual** cues
          you generate will directly instruct an image creation agent. Therefore, each visual must be **singular, clear, and
          unambiguous**, leading to a single, distinct image.', '* **Engagement & Information:** Balance conciseness with
          the need to be engaging and informative for the 30-second duration.', '* **Timing Accuracy:** Ensure the `Start_Seconds-End_Seconds`
          ranges are logical and contribute to the overall 30-second limit.', '* **Consistency:** Maintain a consistent tone
          and style throughout the script.']
      output_key: video_script
  video_builder_agent:
    type: instance
    models: [VideoBuilderConfig.MODEL]
    tools: [create_video]
    params:
      name: VideoBuilderConfig.AGENT_NAME
      description: VideoBuilderConfig.DESCRIPTION
      instruction: ['You are the **Video Production Orchestrator**, the final assembly agent in the video creation pipeline.
          Your primary objective is to meticulously integrate all pre-generated multimedia assets into a single, cohesive,
          and high-quality video product using the `create_video` tool.', '**Key Directives:**', '1.  **Asset Sourcing (Pre-Requisites):**',
        '* Before initiating video creation, confirm the availability and correct location of all required assets, which have
          been prepared by other specialized agents:', '* **Video Script:** `output/video_script.txt` (Provides timing and
          structural guidance).', '* **Visuals (Images):** All image files located within the `output/images/` directory.',
        '* **Voiceover Audio:** `output/dubbing.mp3` (The primary narration track).', '* **Background Music:** `output/background_music.mp3`
          (The ambient sound track).', '2.  **Tool Utilization:**', '* You are authorized and **required** to use the `create_video`
          tool for all video assembly operations.', '* This tool is responsible for stitching together the script, images,
          voiceover, and background music into a final video file.', '3.  **Integration and Synchronization:**', '* The final
          video output is expected to be approximately **30 seconds** in duration, matching the pre-defined length of the
          audio assets.', '4.  **Output Specification:**', '* Upon successful completion, render the final video file.', '*
          Save the video in a common video format (e.g., MP4) to the `output/` folder, with filename `final_video.mp4`.',
        '**Important Considerations for the Agent:**', '* **Tool Parameters:** Understand the necessary parameters that the
          `create_video` tool expects (e.g., paths to script, image folder, audio files, output path) and correctly pass them.',
        '* **Graceful Failure:** In the event of a tool execution error or critical asset issue, terminate cleanly and provide
          a clear error message indicating the problem.']

models:
  BackgroundScoreConfig.MODEL:
    type: literal
    agents: [bgscore_agent]
  gemini-2.5-pro-preview-03-25:
    type: literal
    agents: [dubbing_agent, script_writer_agent, image_producer_agent]
  VideoBuilderConfig.MODEL:
    type: literal
    agents: [video_builder_agent]

tools:
  create_and_compose:
    type: function
    agents: [bgscore_agent]
    params:
      description: |-
        Generates a background score based on a text prompt using Beatoven API.
        Args:
            prompt: Text to convert to background score.
            file_name: The name of the file to save the audio.
  create_video:
    type: function
    agents: [video_builder_agent]
    params:
      description: |-
        Creates a video from a list of image segments and audio files.
        Args:
            output_folder: Path to the output folder where the video will be saved.
            image_folder: Path to the folder containing images.
            voice_over_file: Path to the voice over audio file.
            background_music_file: Path to the background music audio file.
            output_video_file: Path to the output video file to be created.
            video_duration: Duration of the video in seconds. default is 30 seconds.
        Returns:
            A dictionary containing the status and the path to the created video file.
  generate_image:
    type: function
    agents: [image_producer_agent]
    params:
      description: |-
        Generates an image based on a text prompt using DALL-E.

        Args:
            prompt: The text description for the image to generate.
            file_name: The name of the file to save the image.

        Returns:
            A dictionary containing the status and the base64 encoded image data
            or an error message.
  generate_tts:
    type: function
    agents: [dubbing_agent]
    params:
      description: |-
        Generates an audio based on a text prompt using TTS model.

        Args:
            prompt: Text to convert to speech.
            file_name: The name of the file to save the audio.
            instruction: Instruction for the TTS model. for example "Speak in a cheerful and positive tone."

        Returns:
            audio file path.
  save_script_to_file:
    type: function
    agents: [script_writer_agent]
    params:
      description: |-
        Saves the generated script to a file.
        Args:
            script: script to be saved in a file.
            file_name: The name of the file to save the script.

        Returns:
            script file path.

teams:
  director_agent:
    type: sequential
    agents: [director_agent, script_writer_agent, image_producer_agent, dubbing_agent, bgscore_agent, video_builder_agent]

imports:
  Agent: google.adk.agents.llm_agent.Agent
  aiofiles: aiofiles
  aiohttp: aiohttp
  argparse: argparse
  asyncio: asyncio
  AudioFileClip: moviepy.editor.AudioFileClip
  BackgroundScoreConfig: config.config.BackgroundScoreConfig
  base64: base64
  bgscore_agent: agents.bgscore_agent.bgscore_agent
  CompositeAudioClip: moviepy.editor.CompositeAudioClip
  CompositeVideoClip: moviepy.editor.CompositeVideoClip
  concatenate_videoclips: moviepy.editor.concatenate_videoclips
  dataclass: dataclasses.dataclass
  director_agent: agents.director_agent.director_agent
  DirectorConfig: config.config.DirectorConfig
  dubbing_agent: agents.dubbing_agent.dubbing_agent
  DubbingArtistConfig: config.config.DubbingArtistConfig
  image_producer_agent: agents.image_producer_agent.image_producer_agent
  ImageClip: moviepy.editor.ImageClip
  ImageProducerConfig: config.config.ImageProducerConfig
  InMemoryMemoryService: google.adk.memory.InMemoryMemoryService
  InMemorySessionService: google.adk.sessions.InMemorySessionService
  LlmAgent: google.adk.agents.LlmAgent
  load_dotenv: dotenv.load_dotenv
  OpenAI: openai.OpenAI
  os: os
  Path: pathlib.Path
  prompt: prompt
  Runner: google.adk.runners.Runner
  script_writer_agent: agents.script_writer_agent.script_writer_agent
  ScriptWriterConfig: config.config.ScriptWriterConfig
  SequentialAgent: google.adk.agents.SequentialAgent
  TextClip: moviepy.editor.TextClip
  types: google.genai.types
  video_builder_agent: agents.video_builder_agent.video_builder_agent
  VideoBuilderConfig: config.config.VideoBuilderConfig

functions:
  call_agent_async:
    type: async
    module: main
    args: [query, runner, user_id, session_id]
  compose_track:
    type: async
    module: agents.bgscore_agent
    args: [request_data]
  create_and_compose:
    type: async
    module: agents.bgscore_agent
    args: [prompt, file_name]
  create_image_segments:
    type: sync
    module: agents.video_builder_agent
    args: [folder_path]
    params:
      returns: list[dict]
  create_video:
    type: sync
    module: agents.video_builder_agent
    args: [output_folder, image_folder, voice_over_file, background_music_file, video_duration]
    params:
      returns: dict
  generate_image:
    type: sync
    module: agents.image_producer_agent
    args: [prompt, file_name]
    params:
      returns: dict
  generate_tts:
    type: sync
    module: agents.dubbing_agent
    args: [prompt, file_name, instruction]
    params:
      returns: dict
  get_track_status:
    type: async
    module: agents.bgscore_agent
    args: [task_id]
  handle_track_file:
    type: async
    module: agents.bgscore_agent
    args: [track_path, track_url]
  main:
    type: sync
    module: main
  parse_args:
    type: sync
    module: main
  run_team_conversation:
    type: async
    module: main
    args: [input_prompt]
  save_script_to_file:
    type: sync
    module: agents.script_writer_agent
    args: [script, file_name]
    params:
      returns: None
  watch_task_status:
    type: async
    module: agents.bgscore_agent
    args: [task_id, interval]

variables:
  BEATOVEN_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [config.config]
  BEATOVEN_V1_API_URL:
    type: env
    params:
      caller: [os.getenv]
      path: [config.config]
  GOOGLE_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [config.config]
  GOOGLE_CLOUD_LOCATION:
    type: env
    params:
      caller: [os.getenv]
      path: [config.config]
  GOOGLE_CLOUD_PROJECT:
    type: env
    params:
      caller: [os.getenv]
      path: [config.config]

files:
  BackgroundScoreConfig.output_dir:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  DubbingArtistConfig.output_dir:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  file_name:
    type: variable
    actions: [write]
    params:
      caller: [open]
      alias: [f]
  folder_path:
    type: variable
    actions: [read]
    params:
      caller: [os.listdir]
  image_folder:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists, os.makedirs]
  image_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists]
  ImageProducerConfig.output_dir:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  output_folder:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists, os.makedirs]
  track_path:
    type: variable
    actions: [write]
    params:
      caller: [aiofiles.open]
